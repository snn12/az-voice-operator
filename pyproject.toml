[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "az-voice-operator"
version = "0.0.0"
description = "Azerbaijani-first restaurant voice AI operator for reservations and FAQ."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VENSUAR HOLDING" }]
keywords = ["voice-ai", "azerbaijani", "restaurant", "reservations", "fastapi"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# Intentionally empty: the voice engine is not implemented yet and runtime
# dependencies are added only when the corresponding module is built.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
az_voice_operator = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["az_voice_operator", "voice_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
